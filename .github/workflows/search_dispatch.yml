name: 搜索JM本子 (dispatch)

on:
  workflow_dispatch:
    inputs:
      QUERY:
        type: string
        description: '搜索关键词（标题/作者/标签等，如 董卓）。填车号会直接跳到本子详情。'
        required: true

      PAGE:
        type: string
        description: '页码，默认 1'
        required: false

      ORDER_BY:
        type: choice
        description: '排序 o：mr 最新 / mv 观看 / mp 图片数 / tf 点赞 / tr 评分 / md 评论'
        required: false
        options:
          - 默认（mr 最新）
          - mr
          - mv
          - mp
          - tf
          - tr
          - md

      TIME:
        type: choice
        description: '时间范围 t：a 全部 / t 今天 / w 本周 / m 本月'
        required: false
        options:
          - 默认（a 全部）
          - a
          - t
          - w
          - m

      CATEGORY:
        type: choice
        description: '分类 category'
        required: false
        options:
          - '默认（0 全部）'
          - '0'
          - doujin
          - single
          - short
          - another
          - hanman
          - meiman
          - doujin_cosplay
          - english_site

      MAIN_TAG:
        type: string
        description: '标签ID（main_tag），默认 0'
        required: false

      CLIENT_IMPL:
        type: choice
        description: '客户端类型（client.impl）。搜索失败时，可以换成 html 重试。'
        required: false
        options:
          - 默认
          - api
          - html

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # 工作流输入。'默认' 与空值由脚本统一按默认值处理。
      JM_SEARCH_QUERY: ${{ github.event.inputs.QUERY }}
      JM_SEARCH_PAGE: ${{ github.event.inputs.PAGE }}
      JM_SEARCH_ORDER_BY: ${{ github.event.inputs.ORDER_BY }}
      JM_SEARCH_TIME: ${{ github.event.inputs.TIME }}
      JM_SEARCH_CATEGORY: ${{ github.event.inputs.CATEGORY }}
      JM_SEARCH_MAIN_TAG: ${{ github.event.inputs.MAIN_TAG }}
      CLIENT_IMPL: ${{ github.event.inputs.CLIENT_IMPL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装jmcomic（本仓库源码）
        run: |
          python -m pip install --upgrade pip
          pip install -e ./

      - name: 生成可选配置（client.impl）
        if: ${{ inputs.CLIENT_IMPL != '' && inputs.CLIENT_IMPL != '默认' }}
        run: |
          printf 'client:\n  impl: %s\n' "$CLIENT_IMPL" > /tmp/jm_option.yml
          echo "使用配置 /tmp/jm_option.yml:"
          cat /tmp/jm_option.yml
          echo "JM_OPTION_PATH=/tmp/jm_option.yml" >> "$GITHUB_ENV"

      - name: 搜索并写入运行摘要
        run: |
          PYTHONIOENCODING=utf-8 python usage/workflow_search.py
